<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Prank Site</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: #f0f6fc; margin-bottom: 20px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .card h3 { margin-bottom: 15px; color: #58a6ff; }
        label { display: block; margin-top: 10px; font-weight: bold; color: #8b949e; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; color: #c9d1d9; }
        button { background: #238636; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.2s; }
        button:hover { background: #2ea043; }
        .btn-danger { background: #da3633; }
        .btn-danger:hover { background: #f85149; }
        .file-input { border: 2px dashed #30363d; padding: 20px; text-align: center; border-radius: 8px; }
        .file-input input { background: transparent; border: none; }
        .status { padding: 10px; border-radius: 4px; margin-top: 10px; display: none; }
        .status.success { display: block; background: #1b3a1f; color: #7ee787; }
        .status.error { display: block; background: #3a1b1b; color: #f85149; }
        .analytics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .analytics-card { background: #0d1117; border: 1px solid #30363d; padding: 15px; border-radius: 6px; text-align: center; }
        .analytics-card .number { font-size: 32px; font-weight: bold; color: #58a6ff; }
        .analytics-card .label { color: #8b949e; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th { text-align: left; color: #8b949e; border-bottom: 1px solid #30363d; padding: 8px; }
        td { padding: 8px; border-bottom: 1px solid #21262d; word-break: break-word; }
        .login-box { max-width: 400px; margin: 100px auto; background: #161b22; padding: 40px; border-radius: 8px; border: 1px solid #30363d; }
        .login-box h2 { margin-bottom: 20px; }
        .hidden { display: none !important; }
        @media (max-width: 600px) { table { font-size: 11px; } th, td { padding: 4px; } }
    </style>
</head>
<body>
    <div id="login" class="login-box">
        <h2>🔐 Admin Login</h2>
        <label>Password</label>
        <input type="password" id="adminPassword" placeholder="Enter admin password">
        <button onclick="login()" style="width:100%;">Login</button>
        <div id="loginError" style="color:#f85149; margin-top:10px; display:none;">Wrong password!</div>
    </div>

    <div id="dashboard" class="container hidden">
        <h1>🔧 Prank Site Admin Panel</h1>

        <div id="statusMessage" class="status"></div>

        <!-- Upload Files -->
        <div class="card">
            <h3>📸 Upload Images & Sound</h3>
            <div class="file-input">
                <label>Header Logo</label>
                <input type="file" id="logoFile" accept="image/png,image/jpeg">
                <button onclick="uploadFile('logo')">Upload Logo</button>
            </div>
            <div class="file-input" style="margin-top:15px;">
                <label>Banner Image</label>
                <input type="file" id="bannerFile" accept="image/*">
                <button onclick="uploadFile('banner')">Upload Banner</button>
            </div>
            <div class="file-input" style="margin-top:15px;">
                <label>Sound (MP3)</label>
                <input type="file" id="soundFile" accept="audio/mpeg">
                <button onclick="uploadFile('sound')">Upload Sound</button>
            </div>
        </div>

        <!-- Text Config -->
        <div class="card">
            <h3>✏️ Text Settings</h3>
            <label>Website Title</label>
            <input type="text" id="title" placeholder="Universal Institute Kottakkal">
            <label>Welcome Message</label>
            <input type="text" id="welcomeMessage" placeholder="Welcome To Universal">
            <label>OG Title (Social Preview)</label>
            <input type="text" id="ogTitle" placeholder="Universal Institute Kottakkal">
            <label>OG Description (Social Preview)</label>
            <input type="text" id="ogDescription" placeholder="The best coaching institute in Malabar.">
            <label>Delay (seconds)</label>
            <input type="number" id="delay" value="2" min="0" max="10">
            <label>Duration (seconds)</label>
            <input type="number" id="duration" value="10" min="1" max="60">
            <button onclick="saveConfig()">💾 Save Settings</button>
        </div>

        <!-- Analytics Dashboard -->
        <div class="card">
            <h3>📊 Analytics</h3>
            <div class="analytics-grid">
                <div class="analytics-card">
                    <div class="number" id="totalVisits">0</div>
                    <div class="label">Total Visits</div>
                </div>
                <div class="analytics-card">
                    <div class="number" id="totalScreams">0</div>
                    <div class="label">Total Screams Triggered</div>
                </div>
            </div>
            <h4 style="margin-top:20px;">Recent Visitors</h4>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr><th>Time</th><th>Device</th><th>Browser</th><th>OS</th><th>Referrer</th><th>Screamed?</th></tr>
                    </thead>
                    <tbody id="visitorTable"></tbody>
                </table>
            </div>
            <button onclick="refreshAnalytics()" style="margin-top:15px;">🔄 Refresh Analytics</button>
        </div>
    </div>

    <script>
        let password = '';

        function login() {
            const pwd = document.getElementById('adminPassword').value;
            password = pwd;
            fetch('/api/config')
                .then(r => r.json())
                .then(data => {
                    if (data.error) throw new Error('No config');
                    document.getElementById('login').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    loadConfig();
                    refreshAnalytics();
                })
                .catch(() => {
                    document.getElementById('loginError').style.display = 'block';
                });
        }

        function showStatus(msg, isError = false) {
            const el = document.getElementById('statusMessage');
            el.textContent = msg;
            el.className = 'status ' + (isError ? 'error' : 'success');
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 4000);
        }

        function getAuth() {
            return { auth: password };
        }

        async function uploadFile(type) {
            const fileMap = { logo: 'logoFile', banner: 'bannerFile', sound: 'soundFile' };
            const input = document.getElementById(fileMap[type]);
            if (!input.files || input.files.length === 0) {
                showStatus('Please select a file first.', true);
                return;
            }
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64 = e.target.result.split(',')[1];
                try {
                    const res = await fetch('/api/upload', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ...getAuth(), fileType: type, fileData: base64 })
                    });
                    const data = await res.json();
                    if (data.success) {
                        showStatus(`${type} uploaded successfully!`);
                        const config = await fetch('/api/config').then(r => r.json());
                        if (type === 'logo') config.logoUrl = data.url;
                        if (type === 'banner') config.bannerUrl = data.url;
                        if (type === 'sound') config.soundUrl = data.url;
                        await fetch('/api/config', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ ...getAuth(), ...config })
                        });
                        loadConfig();
                    } else {
                        showStatus('Upload failed: ' + (data.error || 'Unknown'), true);
                    }
                } catch (err) {
                    showStatus('Error uploading: ' + err.message, true);
                }
            };
            reader.readAsDataURL(file);
        }

        async function saveConfig() {
            const config = {
                title: document.getElementById('title').value,
                welcomeMessage: document.getElementById('welcomeMessage').value,
                ogTitle: document.getElementById('ogTitle').value,
                ogDescription: document.getElementById('ogDescription').value,
                delay: parseInt(document.getElementById('delay').value),
                duration: parseInt(document.getElementById('duration').value),
            };
            try {
                const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...getAuth(), ...config })
                });
                const data = await res.json();
                if (data.success) {
                    showStatus('Settings saved successfully!');
                } else {
                    showStatus('Error: ' + data.error, true);
                }
            } catch (err) {
                showStatus('Error: ' + err.message, true);
            }
        }

        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                const data = await res.json();
                if (data && !data.error) {
                    document.getElementById('title').value = data.title || '';
                    document.getElementById('welcomeMessage').value = data.welcomeMessage || '';
                    document.getElementById('ogTitle').value = data.ogTitle || '';
                    document.getElementById('ogDescription').value = data.ogDescription || '';
                    document.getElementById('delay').value = data.delay || 2;
                    document.getElementById('duration').value = data.duration || 10;
                }
            } catch (e) {}
        }

        async function refreshAnalytics() {
            try {
                const res = await fetch(`/api/analytics?auth=${encodeURIComponent(password)}`);
                const data = await res.json();
                if (data && !data.error) {
                    document.getElementById('totalVisits').textContent = data.visits ? data.visits.length : 0;
                    document.getElementById('totalScreams').textContent = data.screams || 0;
                    const table = document.getElementById('visitorTable');
                    table.innerHTML = '';
                    const visits = data.visits || [];
                    visits.slice(0, 20).forEach(v => {
                        const row = document.createElement('tr');
                        const date = new Date(v.timestamp).toLocaleString();
                        const device = v.device || 'Unknown';
                        const browser = v.browser || 'Unknown';
                        const os = v.os || 'Unknown';
                        row.innerHTML = `<td>${date}</td><td>${device}</td><td>${browser}</td><td>${os}</td><td>${v.referrer}</td><td>${v.triggered ? '✅ Yes' : '❌ No'}</td>`;
                        table.appendChild(row);
                    });
                }
            } catch (e) {
                console.error('Failed to load analytics', e);
            }
        }
        setInterval(refreshAnalytics, 30000);
    </script>
</body>
</html>
